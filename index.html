<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1f" id="theme-color-meta" />
    <meta name="description" content="v2rayN Nova — Material Design 3 control panel for the v2rayN Web API" />
    <link rel="icon" type="image/x-icon" href="./NotifyIcon1.ico" />
    <title>v2rayN Nova</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        const saved = localStorage.getItem('v2rayn-web-theme')
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('#theme-color-meta').setAttribute('content', dark ? '#1b1b1f' : '#fffbff')
      } catch { /* Storage or matchMedia can be unavailable in hardened browsers. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="./webui-config.js"></script>
    <script type="module" src="/Src/main.ts"></script>
  </body>
</html>
